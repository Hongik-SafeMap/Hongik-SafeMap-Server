name: hongik-safemap-server

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:latest
    command: redis-server --appendonly yes # AOF 활성화
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    image: ${IMAGE_URI:-safemap-app:local}
    build: .
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=datasource
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - JWT_SECRET=${JWT_SECRET}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID}
      - FCM_SERVICE_ACCOUNT_FILE_PATH=/app/firebase-key.json
      - AI_SERVER_URL=${AI_SERVER_URL:-http://localhost:8000}
      - REDIS_HOST=redis
    volumes:
      - /home/ubuntu/firebase-key.json:/app/firebase-key.json
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
    name: safemap-mysql-data
  redis-data:
    name: safemap-redis-data
