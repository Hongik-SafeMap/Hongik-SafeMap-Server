spring:
  application:
    name: Hongik-SafeMap-Server
  profiles:
    group:
      local: "local, datasource"
    include:
      - redis
jwt:
  secret: ${JWT_SECRET}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    region: ${AWS_S3_REGION}
    bucket: ${AWS_S3_BUCKET}
    upload:
      expiration-minutes: 15
