name: Build & Deploy

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: core-api/build/libs/*.jar

  docker-push:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JAR 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: core-api/build/libs/

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 & ECR 푸시
        id: push
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/safemap:${{ github.sha }}
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_URI: ${{ needs.docker-push.outputs.image_uri }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' | base64 -d > /home/ubuntu/firebase-key.json
            chmod 600 /home/ubuntu/firebase-key.json

            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull "$IMAGE_URI"
            docker stop safemap || true
            docker rm safemap || true

            docker images "${{ secrets.ECR_REGISTRY }}/safemap" --format "{{.Tag}} {{.ID}}" | \
              tail -n +3 | \
              awk '{print $2}' | \
              xargs -r docker rmi -f || true

            docker network create safemap-network || true

            docker start safemap-mysql 2>/dev/null || docker run -d \
              --name safemap-mysql \
              --network safemap-network \
              -e MYSQL_ROOT_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e MYSQL_DATABASE=${{ secrets.DATABASE_NAME }} \
              -e MYSQL_USER=${{ secrets.DATABASE_USERNAME }} \
              -e MYSQL_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -v safemap-mysql-data:/var/lib/mysql \
              --restart unless-stopped \
              mysql:8.0

            RETRIES=30
            until docker exec safemap-mysql mysqladmin ping -h localhost --silent; do
              if [ $RETRIES -eq 0 ]; then
                echo "MySQL 시작 실패"
                exit 1
              fi
              echo "MySQL 대기 중... ($RETRIES)"
              sleep 2
              RETRIES=$((RETRIES - 1))
            done

            docker run -d \
              --name safemap \
              --network safemap-network \
              -p 8080:8080 \
              -v /home/ubuntu/firebase-key.json:/app/firebase-key.json \
              -e SPRING_PROFILES_ACTIVE=datasource \
              -e DATABASE_HOST=safemap-mysql \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              -e DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
              -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }} \
              -e AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e AWS_S3_REGION=${{ secrets.AWS_S3_REGION }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }} \
              -e FCM_SERVICE_ACCOUNT_FILE_PATH=/app/firebase-key.json \
              --restart unless-stopped \
              "$IMAGE_URI"
