name: Deploy

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 & ECR 푸시
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/safemap:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull $IMAGE_URI
            docker stop safemap || true
            docker rm safemap || true

            # 이전 이미지 최신 2개만 남기고 삭제
            docker images "${{ secrets.ECR_REGISTRY }}/safemap" --format "{{.Tag}} {{.ID}}" | \
              tail -n +3 | \
              awk '{print $2}' | \
              xargs -r docker rmi -f || true

            # Docker 네트워크 생성 (이미 있으면 무시)
            docker network create safemap-network || true

            # MySQL 컨테이너 실행 (이미 실행 중이면 start, 없으면 새로 생성)
            docker start safemap-mysql 2>/dev/null || docker run -d \
              --name safemap-mysql \
              --network safemap-network \
              -e MYSQL_ROOT_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e MYSQL_DATABASE=${{ secrets.DATABASE_NAME }} \
              -e MYSQL_USER=${{ secrets.DATABASE_USERNAME }} \
              -e MYSQL_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -v safemap-mysql-data:/var/lib/mysql \
              --restart unless-stopped \
              mysql:8.0

            # MySQL 준비될 때까지 대기
            until docker exec safemap-mysql mysqladmin ping -h localhost --silent; do
              echo "MySQL 대기 중..."
              sleep 2
            done

            # 앱 컨테이너 실행
            docker run -d \
              --name safemap \
              --network safemap-network \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=datasource \
              -e DATABASE_HOST=safemap-mysql \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              -e DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
              -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }} \
              -e AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e AWS_S3_REGION=${{ secrets.AWS_S3_REGION }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              --restart unless-stopped \
              $IMAGE_URI