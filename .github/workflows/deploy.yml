name: Deploy

on:
  workflow_run:
    workflows: [ Docker Push ]
    types: [ completed ]
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      image_uri:
        description: '배포할 ECR 이미지 URI (비워두면 ECR 최신 이미지 자동 사용)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: IMAGE_URI 아티팩트 다운로드 (자동 실행)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: image-uri
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: AWS 자격증명 설정 (최신 이미지 조회용)
        if: github.event_name == 'workflow_dispatch' && inputs.image_uri == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: IMAGE_URI 설정
        id: set-image-uri
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "image_uri=$(cat image-uri.txt)" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.image_uri }}" ]; then
            echo "image_uri=${{ inputs.image_uri }}" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG=$(aws ecr describe-images \
              --repository-name safemap \
              --region ap-northeast-2 \
              --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]' \
              --output text)
            echo "image_uri=${{ secrets.ECR_REGISTRY }}/safemap:$LATEST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_URI: ${{ steps.set-image-uri.outputs.image_uri }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            # Firebase 키 파일 생성
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /home/ubuntu/firebase-key.json
            chmod 600 /home/ubuntu/firebase-key.json

            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull $IMAGE_URI
            docker stop safemap || true
            docker rm safemap || true

            # 이전 이미지 최신 2개만 남기고 삭제
            docker images "${{ secrets.ECR_REGISTRY }}/safemap" --format "{{.Tag}} {{.ID}}" | \
              tail -n +3 | \
              awk '{print $2}' | \
              xargs -r docker rmi -f || true

            # Docker 네트워크 생성 (이미 있으면 무시)
            docker network create safemap-network || true

            # MySQL 컨테이너 실행 (이미 실행 중이면 start, 없으면 새로 생성)
            docker start safemap-mysql 2>/dev/null || docker run -d \
              --name safemap-mysql \
              --network safemap-network \
              -e MYSQL_ROOT_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e MYSQL_DATABASE=${{ secrets.DATABASE_NAME }} \
              -e MYSQL_USER=${{ secrets.DATABASE_USERNAME }} \
              -e MYSQL_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -v safemap-mysql-data:/var/lib/mysql \
              --restart unless-stopped \
              mysql:8.0

            # MySQL 준비될 때까지 대기
            RETRIES=30
            until docker exec safemap-mysql mysqladmin ping -h localhost --silent || [ $RETRIES -eq 0 ]; do
            echo "MySQL 대기 중... ($RETRIES)"
            sleep 2
            RETRIES=$((RETRIES-1))

            # 앱 컨테이너 실행
            docker run -d \
              --name safemap \
              --network safemap-network \
              -p 8080:8080 \
              -v /home/ubuntu/firebase-key.json:/app/firebase-key.json \
              -e SPRING_PROFILES_ACTIVE=datasource \
              -e DATABASE_HOST=safemap-mysql \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              -e DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
              -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }} \
              -e AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
              -e AWS_S3_REGION=${{ secrets.AWS_S3_REGION }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }} \
              -e FCM_SERVICE_ACCOUNT_FILE_PATH=/app/firebase-key.json \
              -e AI_SERVER_URL=http://172.31.19.214:8000 \
              --restart unless-stopped \
              $IMAGE_URI
