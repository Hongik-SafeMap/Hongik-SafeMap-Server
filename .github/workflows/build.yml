name: Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드
        run: ./gradlew bootJar

      - name: JAR 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: core-api/build/libs/*.jar
